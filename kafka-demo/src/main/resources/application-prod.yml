# 生产环境配置
spring:
  kafka:
    bootstrap-servers:
      - kafka1.example.com:9092
      - kafka2.example.com:9092
      - kafka3.example.com:9092
    producer:
      retries: 5
      properties:
        enable:
          idempotence: true
    consumer:
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        max:
          poll:
            interval:
              ms: 600000

logging:
  level:
    com.example: INFO